name: Build JavrockAntiFreecam

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build dengan Maven
        working-directory: javrock-antifreecam
        run: mvn clean package

      - name: Upload file JAR
        uses: actions/upload-artifact@v4
        with:
          name: JavrockAntiFreecam-JAR
          path: javrock-antifreecam/target/JavrockAntiFreecam-1.0.0.jar
