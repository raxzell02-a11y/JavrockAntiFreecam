  blocked-in-cave: '&cꜰʀᴇᴇᴄᴀᴍ ᴛɪᴅᴀᴋ ᴅɪɪᴢɪɴᴋᴀɴ ᴅɪ ᴅᴀʟᴀᴍ ᴄᴀᴠᴇ ᴀᴛᴀᴜ ʀᴜᴀɴɢ ᴛᴇʀᴛᴜᴛᴜᴘ! ɴᴀɪᴋ ᴋᴇ ᴀᴛᴀꜱ ᴄᴀᴠᴇ ᴜɴᴛᴜᴋ ᴍᴇɴɢɢᴜɴᴀᴋᴀɴɴʏᴀ.'
  actionbar-dark: '&8[&9&lᴊᴀᴠʀᴏᴄᴋ&8] &7ʟᴀʏᴀʀ ɢᴇʟᴀᴘ: ᴋᴀᴍᴇʀᴀ ᴛᴇʀᴛᴜᴛᴜᴘ ʙʟᴏᴋ / ᴅɪ ᴅᴀʟᴀᴍ ᴄᴀᴠᴇ'
